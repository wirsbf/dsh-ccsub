# claude-server compose
#
# Two deployment shapes, selected by the environment file rather than by editing
# this file:
#
#   .env.local     mode=proxy   — runs on a machine that has no direct route and
#                                 must egress through claude-gate
#   .env.server    mode=direct  — runs on a server whose own address is the
#                                 fixed egress IP worth presenting
#
# Start with either shape:
#
#   docker compose --env-file .env.local up -d --build    build from this tree
#   docker compose --env-file .env.local up -d            pull the published image
#
# `--build` is the difference, not a second file. Both resolve to the same
# service; the published image is what the release workflow pushes, so leaving
# `--build` off tracks the released server instead of one local edit.
#
# The port is published to loopback only. Reaching it from another machine is a
# deliberate tunnel decision (SSH forward or WireGuard), never a bare mapping,
# because the tokens in front of it are the only thing standing between the
# network and the subscription's quota.

services:
  claude-server:
    build: .
    # `CCSUB_IMAGE` selects the published tag, which is how a deployment follows
    # releases without cloning:
    #
    #   CCSUB_IMAGE=ghcr.io/wirsbf/dsh-ccsub-claude-server:0.3.1 \
    #     docker compose --env-file .env.server up -d
    #
    # The default is a local name rather than the registry path, so a plain
    # `--build` keeps working with no environment at all and never collides with
    # a pulled tag.
    image: ${CCSUB_IMAGE:-dsh-ccsub-claude-server:local}
    container_name: claude-server
    restart: unless-stopped

    environment:
      LISTEN_HOST: 0.0.0.0
      LISTEN_PORT: "4710"

      # proxy = mandatory egress proxy; direct = plain connection.
      UPSTREAM_MODE: ${UPSTREAM_MODE:-proxy}
      PROXY_URL: ${PROXY_URL:-http://claude-gate:9077}

      # The admin bootstrap token. Required; the server refuses to start without
      # it. Generate with: openssl rand -base64 36
      #
      # This is no longer handed to every client: create a user for each client
      # on the console's Users page and give them that token instead. The legacy
      # token is what unlocks the console the first time.
      CLIENT_BEARER: ${CLIENT_BEARER:?set CLIENT_BEARER in the env file}

      GRANT_PATH: /data/grant.json
      # The user directory. Defaults to users.json beside GRANT_PATH; set it to
      # put users on a different volume from the grant. Created on first use, so
      # an unwritable path breaks user management without breaking the relay.
      USERS_PATH: ${USERS_PATH:-/data/users.json}
      CLAUDE_CLI_VERSION: ${CLAUDE_CLI_VERSION:-2.1.303}
      # Pinned so the claimed runtime cannot drift with the image.
      STAINLESS_RUNTIME_VERSION: ${STAINLESS_RUNTIME_VERSION:-v22.19.0}
      REFRESH_SKEW_MS: "300000"
      SANITIZE_BODY: "true"
      LOG_LEVEL: ${LOG_LEVEL:-info}

    volumes:
      # The only writable path in the container: it holds the grant and the
      # user directory.
      - claude-grant:/data

    ports:
      - "127.0.0.1:4710:4710"

    networks:
      - proxy-egress

    # The grant and the user directory are the only state — two small files;
    # anything else writing to the filesystem is a compromise worth failing on.
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4710/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3
    # A 1 GB host serving streamed responses dies by OOM before it dies by load.
    deploy:
      resources:
        limits:
          memory: 512M

volumes:
  claude-grant:

# `claude-stealth` carries `claude-gate` (the mihomo proxy) and is only needed in
# proxy mode. It is declared external because the proxy container owns it; this
# compose file must never create or modify it. In direct mode nothing on the
# upstream path uses it, but the network is still attached so one file serves
# both shapes — remove this block if the server target has no such network.
networks:
  proxy-egress:
    external: true
    name: ${PROXY_NETWORK:-claude-stealth}
